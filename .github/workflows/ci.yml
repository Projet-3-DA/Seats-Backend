# L'intégration continue du backend Seats. GitHub exécute ce fichier à chaque push.
#
# Deux jobs, chacun sur une machine neuve :
#   test   installe le projet et lance `npm test` (Jest).
#          Prisma est simulé (src/lib/__mocks__/prisma.js) : le vrai client généré n'est jamais requis
#          par les tests, donc --ignore-scripts (pas de "prisma generate") et aucun secret nécessaire.
#   image  construit l'image Docker et la publie sur ghcr.io. Ne tourne que si `test` a réussi, et
#          seulement quand on pousse le tag "latest" — pas à chaque push sur main. Ce tag est mobile :
#          pour publier une nouvelle image, `git tag -f latest && git push origin latest --force`.

name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm test

  image:
    needs: test
    if: github.ref == 'refs/tags/latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publier dans ghcr.io
    steps:
      - uses: actions/checkout@v7

      # GITHUB_TOKEN est fourni par GitHub à chaque exécution : pas de secret
      # à créer. Le nom du propriétaire doit être en minuscules pour ghcr.io.
      - name: Se connecter au registre
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Deux tags Docker : `latest` (celui qu'on vient de pousser) et `sha-xxxxxxx`, figé sur ce commit.
      - name: Construire et publier l'image
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          SHA=sha-${GITHUB_SHA::7}

          docker build -f backend/Dockerfile \
            -t ghcr.io/$OWNER/seats-backend:latest \
            -t ghcr.io/$OWNER/seats-backend:$SHA \
            backend
          docker push --all-tags ghcr.io/$OWNER/seats-backend
