# Postgres local pour les tests d'intégration (backend/**/*.integration.test.js), en miroir du
# service Postgres de la CI (.github/workflows/ci.yml, job test-integration) : mêmes identifiants,
# même nom de base, pour que les commandes soient identiques en local et en CI.
#
# Démarrer :   docker compose up -d
# Arrêter :    docker compose down          (ajouter -v pour repartir d'une base vide)

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seats_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - seats_postgres_data:/var/lib/postgresql/data

volumes:
  seats_postgres_data:
